<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="StyleSheet" href="AmazonSheet.css" >
</head>
<body>
    <header>
        <div class ="navbar">
            <div class="nav-logo border">
                <div class="logo"></div>
        </div>
        <div class="logo-address border">
            <p class="add-first">Deliver to</p>
                <div class="add-icon" >
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="add-second">Pakistan</p>
                </div>
        </div>

        <div class="nav-search">

            <select class="search-select">
                <option>All</option>
            </select>

            <input placeholder="Search Amazon" class="search-input" >

            <div class="search-icon">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>            
        </div>

        <div class="nav-signin border">
            <p><span>Hello,sign in</span></p>
            <div class="accont-list">
                <p class="nav-sec">Accounts & Lists</p>
                <select class="select-account">
                    <option></option>
                </select>
            </div>
        </div>

        <div class="nav-return border">
            <p><span>Returns</span></p>
            <p class="nav-sec">& Order</p>

        </div>

        <div class="nav-cart border">
            <i class="fa-solid fa-cart-shopping"></i>
            Cart
        </div>
        </div>


        <div class="panel">
            <div class="panal-all border">
                <i class="fa-solid fa-list"></i>
                All
            </div>
            <div class="panal-option">
                <a href="#" class="border"> Today's Deals</a>
                <a href="#" class="border"> Customer Service</a>
                <a href="#" class="border"> Prime Video</a>
                <a href="#" class="border"> Gifts Cards</a>
                <a href="#" class="border"> sell</a>
                <a href="#" class="border"> Registry</a>
            </div> 
        </div>
    </header>
</body>
</html>
